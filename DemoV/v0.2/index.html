<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Personaje - DnD 5e</title>
    <link rel="stylesheet" href="Estilos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hoja de Personaje</h1>
            <button id="download-pdf" class="skill-btn" style="background-color: var(--accent-color); color: white; padding: 10px 20px; border: none; cursor: pointer; margin-top:15px;">Descargar PDF</button>
        </header>

        <main>
            <section class="skills-container" style="margin-bottom: 20px;">
                <h2>Estadísticas</h2>
                <div id="stats-grid" class="skills-grid"></div>
            </section>
            <section class="skills-container" style="margin-bottom: 20px;">
                <h2>Modificadores de Habilidad</h2>
                <div id="mods-grid" class="skills-grid"></div>
            </section>
            <section class="skills-container" style="margin-bottom: 20px;">
                <h2>Tiradas de Salvación</h2>
                <div id="saves-grid" class="skills-grid"></div>
            </section>
            <section class="skills-container">
                <h2>Habilidades (Skills)</h2>
                <div id="skills-grid" class="skills-grid"></div>
            </section>
            <section class="skills-container" style="margin-top: 20px;">
                <h2>Rasgos y Características</h2>
                <div id="rasgos-grid" class="skills-grid" style="grid-template-columns: 1fr;"></div>
            </section>
            <section class="skills-container" style="margin-top: 20px;">
                <h2>Armas y Armaduras</h2>
                <div id="equipo-grid" class="skills-grid" style="grid-template-columns: 1fr;"></div>
            </section>
            <section class="skills-container" style="margin-top: 20px;">
            <!-- Contenedor del título con Flexbox -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--text-muted); padding-bottom: 5px; margin-bottom: 10px;">
                <h2 style="margin: 0; border: none;">Hechizos</h2>
                <div style="display: flex; gap: 15px;">
                    <span class="proficient" style="font-weight: bold; padding: 2px 8px; border: 1px solid #6a1b9a; border-radius: 4px;">Spell Attack Bonus: +6</span>
                    <span class="proficient" style="font-weight: bold; padding: 2px 8px; border: 1px solid #6a1b9a; border-radius: 4px;">Spell Save DC: 14</span>
                </div>
            </div>
            
            <h3>Ranuras de hechizos</h3>
            <div id="ranuras-grid" class="skills-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 20px;"></div>
            
            <div id="hechizos-contenedor"></div>
        </section>
        </main>
    </div>

    <div id="skill-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
