<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabi DM - Selección de Personaje - DnD 5e</title>
    <link rel="stylesheet" href="estilos-menu.css">
    <script>
        // Aplica el tema guardado ANTES de pintar la página (evita el flash del tema por defecto).
        (function () {
            try {
                if (localStorage.getItem('tema') === 'oscuro') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <button type="button" id="btn-tema" class="btn-tema" title="Cambiar tema">🌙</button>
    <script>
        // Toggle de tema claro/oscuro (mismo patrón en todas las páginas de la app).
        (function () {
            var btn = document.getElementById('btn-tema');
            function actualizarIconoTema() {
                var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = oscuro ? '☀️' : '🌙';
                btn.title = oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
            }
            actualizarIconoTema();
            btn.addEventListener('click', function () {
                var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
                if (oscuro) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('tema', 'claro');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('tema', 'oscuro');
                }
                actualizarIconoTema();
            });
        })();
    </script>
    <div class="menu-container">
        <header>
            <h1>Gabi DM</h1>
            <p class="subtitle">Hoja de Personaje - DnD 5e</p>
            <a href="index.html" class="volver-link">← Volver al menú principal</a>
        </header>
        <!-- El emoji de cada card sale de ICONOS_PERSONAJE (Scripts/Datos/Constantes.js), el
             mismo mapa que usa la ficha para el ícono a los lados del nombre: así menú y ficha
             nunca quedan distintos. El emoji escrito acá es solo un respaldo por si el módulo
             no carga; el valor que manda es el de Constantes.js. -->
        <div class="personajes-grid">
            <a href="personaje.html?p=gabi_DM/sele" class="personaje-card" data-personaje="gabi_DM/sele">
                <div class="personaje-icon">🕊️</div>
                <div class="personaje-nombre">Sele</div>
            </a>
            <a href="personaje.html?p=gabi_DM/nahue" class="personaje-card" data-personaje="gabi_DM/nahue">
                <div class="personaje-icon">⚡</div>
                <div class="personaje-nombre">Nahue</div>
            </a>
            <a href="personaje.html?p=gabi_DM/angie" class="personaje-card" data-personaje="gabi_DM/angie">
                <div class="personaje-icon">🔪</div>
                <div class="personaje-nombre">Angie</div>
            </a>
            <a href="personaje.html?p=gabi_DM/milu" class="personaje-card" data-personaje="gabi_DM/milu">
                <div class="personaje-icon">🔱</div>
                <div class="personaje-nombre">Milu</div>
            </a>
            <a href="personaje.html?p=gabi_DM/teo" class="personaje-card" data-personaje="gabi_DM/teo">
                <div class="personaje-icon">🪓</div>
                <div class="personaje-nombre">Teo</div>
            </a>
            <a href="personaje.html?p=gabi_DM/santi" class="personaje-card" data-personaje="gabi_DM/santi">
                <div class="personaje-icon">❓</div>
                <div class="personaje-nombre">Santi</div>
            </a>
        </div>
    </div>
    <script type="module">
        import { ICONOS_PERSONAJE } from './Scripts/Datos/Constantes.js';
        document.querySelectorAll('.personaje-card[data-personaje]').forEach(card => {
            const icono = ICONOS_PERSONAJE[card.dataset.personaje];
            const el = card.querySelector('.personaje-icon');
            if (icono && el) el.textContent = icono;
        });
    </script>
</body>
</html>
