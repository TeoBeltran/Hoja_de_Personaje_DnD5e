<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemigos - DnD 5e</title>
    <link rel="stylesheet" href="estilos-menu.css">
    <script>
        // Aplica el tema guardado ANTES de pintar la página (evita el flash del tema por defecto).
        (function () {
            try {
                if (localStorage.getItem('tema') === 'oscuro') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* ===== Modal genérico + form-modal (mismo patrón que combate.html) ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            margin: auto;
            padding: 25px;
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            color: var(--text-color);
        }

        .close-btn {
            color: var(--text-muted);
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--accent-color); }

        .form-modal label {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            margin: 12px 0 4px 0;
        }

        .form-modal input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .form-modal select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .form-modal textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.4;
            resize: vertical;
        }

        .modal-content.modal-ancho {
            max-width: 680px;
        }

        .btn-copiar {
            width: 100%;
            margin-top: 8px;
            padding: 9px;
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            background: none;
            color: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
        }

        .btn-copiar:hover { background-color: var(--accent-color); color: white; }

        .check-mas-dano {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .check-mas-dano input { width: auto; }

        .mods-grid-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        .mods-grid-form label {
            text-align: center;
            margin: 0 0 4px 0;
        }

        .mods-grid-form input {
            text-align: center;
        }

        .modal-acciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-acciones button {
            padding: 10px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-cancelar { background-color: var(--text-muted); }
        .btn-confirmar { background-color: var(--accent-color); }

        .confirm-panel { text-align: center; }
        .confirm-panel p { font-size: 1.05rem; margin-bottom: 20px; line-height: 1.5; }

        .personaje-card.btn-agregar {
            border-style: dashed;
            cursor: pointer;
            background: none;
            font-family: inherit;
        }

        .grid-vacio {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>
    <button type="button" id="btn-tema" class="btn-tema" title="Cambiar tema">🌙</button>
    <script>
        // Toggle de tema claro/oscuro (mismo patrón en todas las páginas de la app).
        (function () {
            var btn = document.getElementById('btn-tema');
            function actualizarIconoTema() {
                var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = oscuro ? '☀️' : '🌙';
                btn.title = oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
            }
            actualizarIconoTema();
            btn.addEventListener('click', function () {
                var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
                if (oscuro) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('tema', 'claro');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('tema', 'oscuro');
                }
                actualizarIconoTema();
            });
        })();
    </script>
    <div class="menu-container">
        <header>
            <h1 id="titulo-pagina">🐉 Enemigos</h1>
            <p class="subtitle" id="subtitulo-pagina">Bestiario de la mesa</p>
        </header>

        <!-- Sin login propio: el acceso a esta página ya queda gateado un nivel arriba,
             por el login de extras.html (usuario/clave DM). -->
        <div class="personajes-grid" id="enemigos-grid"></div>
        <a href="extras.html" class="volver-link">← Volver a Extras</a>
        <a href="index.html" class="volver-link" style="margin-top: 8px;">← Volver al menú principal</a>
    </div>

    <!-- ===== Modal: Agregar Enemigo (form + paso de confirmación) ===== -->
    <div id="modal-agregar" class="modal">
        <div class="modal-content form-modal">
            <span class="close-btn" data-close="modal-agregar">&times;</span>

            <div id="panel-form">

                        <option value="🕷️">🕷️ Araña</option>
                        <option value="🦂">🦂 Escorpión</option>
                        <option value="🐍">🐍 Serpiente</option>
                        <option value="🐺">🐺 Lobo</option>
                        <option value="🐗">🐗 Jabalí</option>
                        <option value="🦇">🦇 Murciélago</option>
                        <option value="🦖">🦖 Bestia grande</option>
                        <option value="🦁">🦁 Bestia felina</option>
                        <option value="🐻">🐻 Oso</option>
                        <option value="🦅">🦅 Bestia voladora</option>
                        <option value="🐸">🐸 Bestia pequeña</option>
                        <option value="🐀">🐀 Alimaña</option>
                        <option value="🦟">🦟 Enjambre</option>
                        <option value="🐙">🐙 Aberración</option>
                        <option value="👁️">👁️ Ojo / Aberración</option>
                        <option value="🔥">🔥 Elemental de Fuego</option>
                        <option value="❄️">❄️ Elemental de Hielo</option>
                        <option value="⚡">⚡ Elemental de Rayo</option>
                        <option value="🪨">🪨 Gólem / Roca</option>
                        <option value="🧙">🧙 Humanoide (caster)</option>
                        <option value="🗡️">🗡️ Humanoide (guerrero)</option>

                        <div><label for="en-dex">DEX</label><input type="number" id="en-dex" value="0" required></div>
                        <div><label for="en-con">CON</label><input type="number" id="en-con" value="0" required></div>
                        <div><label for="en-int">INT</label><input type="number" id="en-int" value="0" required></div>
                        <div><label for="en-wis">WIS</label><input type="number" id="en-wis" value="0" required></div>

            <div id="panel-confirm" class="confirm-panel" style="display: none;">

    <!-- ===== Modal: Importar Enemigo (JSON) ===== -->
    <div id="modal-importar" class="modal">
        <div class="modal-content form-modal modal-ancho">
            <span class="close-btn" data-close="modal-importar">&times;</span>
            <h3 style="color: var(--accent-color); margin-top: 0;">Importar Enemigo (JSON)</h3>

            <label for="import-instrucciones">1. Copiá esto y pegáselo a una IA junto con la descripción del monstruo que querés (un enemigo por vez)</label>
            <textarea id="import-instrucciones" readonly rows="7"></textarea>
            <button type="button" class="btn-copiar" id="btn-copiar-instrucciones">📋 Copiar instrucciones</button>

            <label for="import-json" style="margin-top: 20px;">2. Pegá acá el JSON que te devolvió la IA</label>
            <textarea id="import-json" rows="10" placeholder='Un solo enemigo: { "nombre": "...", "vidaMaxima": 30, ... }'></textarea>
            <div class="login-error" id="import-error"></div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" data-close="modal-importar">Cancelar</button>
                <button type="button" class="btn-confirmar" id="btn-importar-confirmar">Confirmar</button>
            </div>

    <script src="enemigos-comun.js"></script>
    <script>
        // ==========================================================
        // Esta página ya NO tiene login propio (antes lo tenía, usuario DM):
        // el acceso queda gateado un nivel arriba por el login de extras.html.
        // Los enemigos en sí NO viven en un array hardcodeado acá: se
        // guardan en localStorage (una key "enemigo_<id>" por cada uno,
        // creados desde el modal de abajo) y esta página los enumera
        // escaneando localStorage por prefijo "enemigo_".
        // ==========================================================

        function slugify(nombre) {
            return nombre
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '') || 'enemigo';
        }

        function fmtMod(n) {
            n = parseInt(n) || 0;
            return n >= 0 ? `+${n}` : `${n}`;
        }

        function listarEnemigos() {
            const lista = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('enemigo_')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data && data.id && data.nombre) lista.push(data);
                    } catch (e) { /* key corrupta, se ignora */ }
                }
            }
            lista.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
            return lista;
        }

        function renderGrid() {
            const grid = document.getElementById('enemigos-grid');
            grid.innerHTML = '';
            const lista = listarEnemigos();

            lista.forEach(en => {
                const a = document.createElement('a');
                a.href = `enemigo.html?id=${encodeURIComponent(en.id)}`;
                a.className = 'personaje-card';
                a.innerHTML = `
                    <div class="personaje-icon">${en.icono || '👹'}</div>
                    <div class="personaje-nombre">${en.nombre}</div>
                `;
                grid.appendChild(a);
            });

            const btnAgregar = document.createElement('button');
            btnAgregar.type = 'button';
            btnAgregar.className = 'personaje-card btn-agregar';
            btnAgregar.innerHTML = `
                <div class="personaje-icon">➕</div>
                <div class="personaje-nombre">Agregar</div>
            `;
            btnAgregar.addEventListener('click', abrirModalAgregar);
            grid.appendChild(btnAgregar);

            const btnImportar = document.createElement('button');
            btnImportar.type = 'button';
            btnImportar.className = 'personaje-card btn-agregar';
            btnImportar.innerHTML = `
                <div class="personaje-icon">📥</div>
                <div class="personaje-nombre">Importar</div>
            `;
            btnImportar.addEventListener('click', abrirModalImportar);
            grid.appendChild(btnImportar);
        }

        // ===== Modal Agregar Enemigo =====
        const modalAgregar = document.getElementById('modal-agregar');
        const panelForm = document.getElementById('panel-form');
        const panelConfirm = document.getElementById('panel-confirm');
        const formEnemigo = document.getElementById('form-enemigo');
        let datosPendientes = null;

        const enIconoSelect = document.getElementById('en-icono');
        const enIconoCustom = document.getElementById('en-icono-custom');

        enIconoSelect.addEventListener('change', () => {
            const esCustom = enIconoSelect.value === '__custom__';
            enIconoCustom.style.display = esCustom ? 'block' : 'none';
            if (esCustom) enIconoCustom.focus();
        });

        function obtenerIconoElegido() {
            if (enIconoSelect.value === '__custom__') {
                return enIconoCustom.value.trim() || '👹';
            }
            return enIconoSelect.value;
        }

        const enLegendariasCheck = document.getElementById('en-legendarias-check');
        const enLegendariasCantCont = document.getElementById('en-legendarias-cant-cont');

        enLegendariasCheck.addEventListener('change', () => {
            enLegendariasCantCont.style.display = enLegendariasCheck.checked ? 'block' : 'none';
        });

        function abrirModalAgregar() {
            formEnemigo.reset();
            ['en-str', 'en-dex', 'en-con', 'en-int', 'en-wis', 'en-cha'].forEach(id => {
                document.getElementById(id).value = 0;
            });
            enIconoSelect.value = '👹';
            enIconoCustom.value = '';
            enIconoCustom.style.display = 'none';
            document.getElementById('en-multiataque').value = 0;
            enLegendariasCheck.checked = false;
            document.getElementById('en-legendarias-cant').value = 3;
            enLegendariasCantCont.style.display = 'none';
            panelForm.style.display = 'block';
            panelConfirm.style.display = 'none';
            modalAgregar.style.display = 'flex';
        }

        function cerrarModalAgregar() {
            modalAgregar.style.display = 'none';
            datosPendientes = null;
        }

        formEnemigo.addEventListener('submit', function (e) {
            e.preventDefault();
            const nombre = document.getElementById('en-nombre').value.trim();
            if (!nombre) return;

            datosPendientes = {
                nombre,
                icono: obtenerIconoElegido(),
                vida: parseInt(document.getElementById('en-vida').value) || 0,
                ca: parseInt(document.getElementById('en-ca').value) || 0,
                velocidad: Math.max(0, parseInt(document.getElementById('en-velocidad').value) || 0),
                iniciativa: parseInt(document.getElementById('en-iniciativa').value) || 0,
                multiataque: (function () {
                    const n = parseInt(document.getElementById('en-multiataque').value) || 0;
                    return n >= 2 ? n : 0;
                })(),
                legendariasHabilitadas: enLegendariasCheck.checked,
                legendariasPorRonda: enLegendariasCheck.checked ? Math.max(1, parseInt(document.getElementById('en-legendarias-cant').value) || 1) : 0,
                mods: {
                    STR: parseInt(document.getElementById('en-str').value) || 0,
                    DEX: parseInt(document.getElementById('en-dex').value) || 0,
                    CON: parseInt(document.getElementById('en-con').value) || 0,
                    INT: parseInt(document.getElementById('en-int').value) || 0,
                    WIS: parseInt(document.getElementById('en-wis').value) || 0,
                    CHA: parseInt(document.getElementById('en-cha').value) || 0
                }
            };

            document.getElementById('confirm-resumen').innerHTML =
                `¿Confirmás crear a ${datosPendientes.icono} <strong>${datosPendientes.nombre}</strong>?<br>` +
                `Vida ${datosPendientes.vida} · CA ${datosPendientes.ca} · Velocidad ${datosPendientes.velocidad}ft · Iniciativa ${fmtMod(datosPendientes.iniciativa)}<br>` +
                (datosPendientes.multiataque ? `Multiataque: ${datosPendientes.multiataque} acciones/turno` : `Acciones/turno: 1`) +
                (datosPendientes.legendariasHabilitadas ? ` · Acciones legendarias: ${datosPendientes.legendariasPorRonda}/ronda` : '') + `<br>` +
                `STR ${fmtMod(datosPendientes.mods.STR)} · DEX ${fmtMod(datosPendientes.mods.DEX)} · CON ${fmtMod(datosPendientes.mods.CON)} · ` +
                `INT ${fmtMod(datosPendientes.mods.INT)} · WIS ${fmtMod(datosPendientes.mods.WIS)} · CHA ${fmtMod(datosPendientes.mods.CHA)}`;

            panelForm.style.display = 'none';
            panelConfirm.style.display = 'block';
        });

        document.getElementById('btn-confirm-no').addEventListener('click', function () {
            // "No" vuelve al modal (no lo cierra), como pidió el usuario.
            panelConfirm.style.display = 'none';
            panelForm.style.display = 'block';
        });

        document.getElementById('btn-confirm-si').addEventListener('click', function () {
            if (!datosPendientes) return;
            const id = `${slugify(datosPendientes.nombre)}_${Date.now().toString(36)}`;
            // Si tiene Multiataque se crea sola la acción "Multiataque": las acciones por
            // turno salen de ahí (se recalculan en vivo si después se edita o se borra).
            const acciones = [];
            if (datosPendientes.multiataque) {
                acciones.push(EnemigosComun.normalizarEntrada({
                    nombre: 'Multiataque',
                    multiataque: datosPendientes.multiataque,
                    desc: `Realiza ${datosPendientes.multiataque} ataques.`
                }, true));
            }
            const record = {
                id,
                nombre: datosPendientes.nombre,
                icono: datosPendientes.icono,
                vidaMaxima: datosPendientes.vida,
                vidaActual: datosPendientes.vida,
                caBase: datosPendientes.ca,
                caActual: datosPendientes.ca,
                velocidad: datosPendientes.velocidad,
                iniciativa: datosPendientes.iniciativa,
                accionesPorTurnoBase: 1,
                accionesPorTurno: 1,
                legendariasHabilitadas: datosPendientes.legendariasHabilitadas,
                legendariasPorRonda: datosPendientes.legendariasPorRonda,
                turnoActual: {
                    accion: 1,
                    bonus: 1,
                    reaccion: 1,
                    legendaria: datosPendientes.legendariasPorRonda
                },
                mods: datosPendientes.mods,
                habilidades: [],
                acciones,
                accionesBonus: [],
                reacciones: [],
                accionesLegendarias: []
            };
            EnemigosComun.sincronizarAcciones(record);
            localStorage.setItem(`enemigo_${id}`, JSON.stringify(record));
            cerrarModalAgregar();
            renderGrid();
        });

        // ==========================================================
        // Modal Importar Enemigo (JSON pegado a mano, generado por una IA).
        // No hay selector de archivo: el flujo es copiar el texto de
        // instrucciones, pegarlo en un chat de IA junto con la descripción
        // del monstruo deseado, y pegar el JSON que devuelva en el textarea
        // de abajo. UN enemigo por importación: se espera un único objeto
        // JSON (un array de varios se rechaza con un mensaje claro).
        // ==========================================================
        const INSTRUCCIONES_IMPORT_JSON =
`Necesito que generes el JSON de UN SOLO enemigo de D&D 5e. Reglas obligatorias:
- Un solo enemigo por respuesta. Si te describo varios, armá solo el primero.
- Devolvé UN ÚNICO objeto JSON { ... }. NUNCA un array [ ... ], ni varios objetos.
- Devolvé SOLO el JSON: sin texto antes ni después, sin comentarios y sin bloques de código \`\`\`.
- Respetá EXACTAMENTE esta estructura (no agregues campos extra ni el campo "id"):

{
  "nombre": string,
  "icono": string (UN solo emoji, ej "🐉"),
  "vidaMaxima": number,
  "caBase": number,
  "velocidad": number (en pies, SOLO el número, ej 30 — no "30ft"),
  "iniciativa": number (el modificador ya calculado, ej 2),
  "accionesPorTurno": number (1 salvo casos raros; si tiene Multiataque NO hace falta tocarlo, se calcula solo desde la acción Multiataque),
  "legendariasHabilitadas": boolean,
  "legendariasPorRonda": number (0 si legendariasHabilitadas es false),
  "mods": { "STR": number, "DEX": number, "CON": number, "INT": number, "WIS": number, "CHA": number } (los MODIFICADORES ya calculados, no el puntaje bruto),
  "habilidades": [ ...entradas... ],
  "acciones": [ ...entradas... ],
  "accionesBonus": [ ...entradas... ],
  "reacciones": [ ...entradas... ],
  "accionesLegendarias": [ ...entradas... ]
}

Cada entrada dentro de esos 5 arrays (podés dejar el array vacío [] si no aplica) tiene esta forma:

{
  "nombre": string,
  "bonoAtaque": number o null (lo que se suma a 1d20 al atacar; null si no es un ataque),
  "alcance": string (ej "cuerpo a cuerpo 5 ft", "" si no aplica),
  "danos": [ { "cantidad": number, "dado": "4"|"6"|"8"|"10"|"12" (STRING, SIN la letra "d"), "extra": number, "tipoDano": string en español minúscula (cortante/perforante/contundente/ácido/frío/fuego/fuerza/necrótico/veneno/psíquico/radiante/rayo/trueno) } ] (array vacío [] si no hace daño numérico; puede tener 2 elementos si hace dos tipos de daño distintos),
  "consumo": number (SOLO relevante en "acciones" y "accionesLegendarias": cuántas unidades de ese pool gasta usar esta entrada, default 1),
  "usosPorTurno": number o null (máximo de veces que se puede usar ESTA entrada por turno; null = sin límite propio, solo la limita la cantidad de acciones que queden),
  "multiataque": number (SOLO en la entrada "Multiataque" dentro de "acciones": la cantidad total de ataques que hace por turno; 0 en todas las demás entradas),
  "desc": string (descripción del efecto en español),
  "efectoAdicional": string ("" si no aplica; ej una tirada de salvación y qué pasa si falla/acierta)
}

=== CÓMO FUNCIONAN LOS ATAQUES MÚLTIPLES EN ESTA APP (LEELO ENTERO, ES LO MÁS IMPORTANTE) ===

La app funciona así:
- El enemigo tiene un contador de Acciones por turno (ej "Acciones 4/4").
- Cada vez que usa una entrada de "acciones", gasta "consumo" Acciones de ese contador.
- Si la entrada tiene "usosPorTurno", además tiene su propio contador (ej "Mordisco 2/2") y no se puede usar más veces que eso en el turno.
- Si la entrada tiene "usosPorTurno": null, se puede usar mientras queden Acciones.
- Todo se reinicia al empezar cada turno.

Reglas para armar el Multiataque:
1. Si el monstruo tiene Multiataque, agregá en "acciones" UNA entrada así:
   { "nombre": "Multiataque", "bonoAtaque": null, "alcance": "", "danos": [], "consumo": 1, "usosPorTurno": null, "multiataque": N, "desc": "<el texto del Multiataque>", "efectoAdicional": "" }
   N = la cantidad TOTAL de cosas que hace en su turno con el Multiataque. Esa entrada le da N Acciones por turno automáticamente. No se "usa": solo define N.
2. Cada ataque individual (Garra, Mordisco, Cola, Espada...) es OTRA entrada en "acciones" con "consumo": 1 (un ataque = una Acción).
3. "usosPorTurno" de cada ataque = cuántas veces COMO MÁXIMO aparece ese ataque en el Multiataque.
   - Si ese ataque puede llenar TODOS los lugares del Multiataque (es el que "rellena el resto", o el único ataque), va "usosPorTurno": null.
   - Si está limitado (ej "uno con la cola"), va ese número (ej "usosPorTurno": 1).
4. Si el Multiataque incluye algo que no es un ataque (ej "usa Presencia Aterradora y después hace 3 ataques"), eso también cuenta en N (N = 4) y esa habilidad va como entrada en "acciones" con "consumo": 1 y "usosPorTurno": 1.
5. Si dice "puede reemplazar uno de los ataques por X" (ej un conjuro o una habilidad), X va en "acciones" con "consumo": 1 y "usosPorTurno" = cuántas veces puede reemplazar (normalmente 1).
6. Si hay alternativas excluyentes con "o" (ej "hace dos ataques con espada, o uno con el arco largo"), el que usa TODO el turno lleva "consumo": N (ej Arco largo con "consumo": 2), así gasta todas las Acciones de una.
7. Acciones que NO son parte del Multiataque y ocupan el turno entero (ej un Aliento de dragón, un conjuro de Acción completa) llevan "consumo": N, así usarlas gasta todas las Acciones.
8. Si NO tiene Multiataque: no agregues la entrada Multiataque, "accionesPorTurno": 1, todos con "multiataque": 0, los ataques con "consumo": 1 y "usosPorTurno": null.
9. En "accionesLegendarias", "consumo" es lo que cuesta cada una (ej "cuesta 2 acciones" → "consumo": 2). En "accionesBonus" y "reacciones" dejá "consumo": 1.
10. "multiataque" va en 0 en TODAS las entradas salvo la del Multiataque.

        function normalizarEnemigoImportado(obj) {
            if (!obj || typeof obj !== 'object') return null;
            const nombre = obj.nombre ? String(obj.nombre).trim() : '';
            if (!nombre) return null;

            const vidaMaxima = Math.max(1, parseInt(obj.vidaMaxima) || 1);
            const caBase = Math.max(0, parseInt(obj.caBase) || 10);
            const accionesPorTurnoBase = Math.max(1, parseInt(obj.accionesPorTurno) || 1);
            const legendariasHabilitadas = !!obj.legendariasHabilitadas;
            const legendariasPorRonda = legendariasHabilitadas ? Math.max(1, parseInt(obj.legendariasPorRonda) || 1) : 0;
            const mods = (obj.mods && typeof obj.mods === 'object') ? obj.mods : {};
            const id = `${slugify(nombre)}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
            const lista = (clave, permiteMulti) => Array.isArray(obj[clave])
                ? obj[clave].map(e => EnemigosComun.normalizarEntrada(e, permiteMulti))
                : [];

            const record = {
                id,
                nombre,
                icono: (obj.icono && String(obj.icono).trim()) || '👹',
                vidaMaxima,
                vidaActual: vidaMaxima,
                caBase,
                caActual: caBase,
                velocidad: (!isNaN(parseInt(obj.velocidad)) && parseInt(obj.velocidad) >= 0) ? parseInt(obj.velocidad) : 30,
                iniciativa: parseInt(obj.iniciativa) || 0,
                accionesPorTurnoBase,
                accionesPorTurno: accionesPorTurnoBase,
                legendariasHabilitadas,
                legendariasPorRonda,
                turnoActual: { accion: accionesPorTurnoBase, bonus: 1, reaccion: 1, legendaria: legendariasPorRonda },
                mods: {
                    STR: parseInt(mods.STR) || 0,
                    DEX: parseInt(mods.DEX) || 0,
                    CON: parseInt(mods.CON) || 0,
                    INT: parseInt(mods.INT) || 0,
                    WIS: parseInt(mods.WIS) || 0,
                    CHA: parseInt(mods.CHA) || 0
                },
                habilidades: lista('habilidades', true),
                acciones: lista('acciones', true),
                accionesBonus: lista('accionesBonus', false),
                reacciones: lista('reacciones', false),
                accionesLegendarias: lista('accionesLegendarias', false)
            };
            // Acciones por turno efectivas: si hay Multiataque, sale de ahí.
            EnemigosComun.sincronizarAcciones(record);

        document.getElementById('btn-importar-confirmar').addEventListener('click', function () {
            const raw = importJsonTA.value.trim();

            // Si la IA igual lo mandó dentro de un bloque ```json ... ```, se lo saca.
            const limpio = raw.replace(/^```[a-zA-Z]*\s*/, '').replace(/\s*```$/, '').trim();

            let parsed;
            try {
                parsed = JSON.parse(limpio);
            } catch (e) {
                importErrorEl.textContent = 'Ese texto no es un JSON válido: ' + e.message;
                return;

            // Un solo enemigo por importación. Un array de UN elemento se acepta igual
            // (es el mismo enemigo); con más de uno se pide importarlos de a uno.
            if (Array.isArray(parsed)) {
                if (parsed.length === 1) {
                    parsed = parsed[0];

                        ? 'El JSON es un array vacío. Pegá un solo enemigo: un objeto { ... }.'
                        : `Pegaste ${parsed.length} enemigos en un array. Se importa uno por vez: pegá un solo objeto { ... }.`;
