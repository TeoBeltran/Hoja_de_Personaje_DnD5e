<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enemigos - DnD 5e</title>
    <link rel="stylesheet" href="estilos-menu.css">
    <style>
        /* ===== Modal genérico + form-modal (mismo patrón que combate.html) ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            margin: auto;
            padding: 25px;
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            color: var(--text-color);
        }

        .close-btn {
            color: var(--text-muted);
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--accent-color); }

        .form-modal label {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            margin: 12px 0 4px 0;
        }

        .form-modal input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .form-modal select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
        }

        .form-modal textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.4;
            resize: vertical;
        }

        .modal-content.modal-ancho {
            max-width: 680px;
        }

        .btn-copiar {
            width: 100%;
            margin-top: 8px;
            padding: 9px;
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            background: none;
            color: var(--accent-color);
            font-weight: bold;
            cursor: pointer;
        }

        .btn-copiar:hover { background-color: var(--accent-color); color: white; }

        .check-mas-dano {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .check-mas-dano input { width: auto; }

        .mods-grid-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        .mods-grid-form label {
            text-align: center;
            margin: 0 0 4px 0;
        }

        .mods-grid-form input {
            text-align: center;
        }

        .modal-acciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-acciones button {
            padding: 10px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-cancelar { background-color: var(--text-muted); }
        .btn-confirmar { background-color: var(--accent-color); }

        .confirm-panel { text-align: center; }
        .confirm-panel p { font-size: 1.05rem; margin-bottom: 20px; line-height: 1.5; }

        .personaje-card.btn-agregar {
            border-style: dashed;
            cursor: pointer;
            background: none;
            font-family: inherit;
        }

        .grid-vacio {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <header>
            <h1 id="titulo-pagina">🐉 Enemigos</h1>
            <p class="subtitle" id="subtitulo-pagina">Acceso restringido</p>
        </header>

        <!-- === Formulario de login (se oculta si ya hay sesión guardada) === -->
        <div class="login-container" id="login-container">
            <form class="login-form" id="login-form" autocomplete="off">
                <div>
                    <label for="login-usuario">Usuario</label>
                    <input type="text" id="login-usuario" name="usuario" autocomplete="off" required>
                </div>
                <div>
                    <label for="login-clave">Contraseña</label>
                    <input type="password" id="login-clave" name="clave" autocomplete="off" required>
                </div>
                <div class="login-error" id="login-error"></div>
                <button type="submit">Ingresar</button>
            </form>
            <a href="index.html" class="volver-link">← Volver al menú principal</a>
        </div>

        <!-- === Grid de enemigos (se muestra solo si el login es correcto) === -->
        <div class="personajes-grid" id="enemigos-grid" style="display: none;"></div>
        <a href="index.html" class="volver-link" id="volver-link-grid" style="display: none;">← Volver al menú principal</a>
    </div>

    <!-- ===== Modal: Agregar Enemigo (form + paso de confirmación) ===== -->
    <div id="modal-agregar" class="modal">
        <div class="modal-content form-modal">
            <span class="close-btn" data-close="modal-agregar">&times;</span>

            <div id="panel-form">
                <h3 style="color: var(--accent-color); margin-top: 0;">Nuevo Enemigo</h3>
                <form id="form-enemigo">
                    <label for="en-nombre">Nombre</label>
                    <input type="text" id="en-nombre" required>

                    <label for="en-icono">Ícono</label>
                    <select id="en-icono">
                        <option value="👹">👹 Ogro / Demonio</option>
                        <option value="👺">👺 Trasgo / Goblin</option>
                        <option value="🧌">🧌 Trol</option>
                        <option value="💀">💀 Esqueleto / No-muerto</option>
                        <option value="🧟">🧟 Zombie</option>
                        <option value="👻">👻 Fantasma / Espectro</option>
                        <option value="🐉">🐉 Dragón</option>
                        <option value="🐲">🐲 Bestia dracónica</option>
                        <option value="🕷️">🕷️ Araña</option>
                        <option value="🦂">🦂 Escorpión</option>
                        <option value="🐍">🐍 Serpiente</option>
                        <option value="🐺">🐺 Lobo</option>
                        <option value="🐗">🐗 Jabalí</option>
                        <option value="🦇">🦇 Murciélago</option>
                        <option value="🦖">🦖 Bestia grande</option>
                        <option value="🦁">🦁 Bestia felina</option>
                        <option value="🐻">🐻 Oso</option>
                        <option value="🦅">🦅 Bestia voladora</option>
                        <option value="🐸">🐸 Bestia pequeña</option>
                        <option value="🐀">🐀 Alimaña</option>
                        <option value="🦟">🦟 Enjambre</option>
                        <option value="🐙">🐙 Aberración</option>
                        <option value="👁️">👁️ Ojo / Aberración</option>
                        <option value="🔥">🔥 Elemental de Fuego</option>
                        <option value="❄️">❄️ Elemental de Hielo</option>
                        <option value="⚡">⚡ Elemental de Rayo</option>
                        <option value="🪨">🪨 Gólem / Roca</option>
                        <option value="🧙">🧙 Humanoide (caster)</option>
                        <option value="🗡️">🗡️ Humanoide (guerrero)</option>
                        <option value="🏹">🏹 Humanoide (arquero)</option>
                        <option value="👑">👑 Jefe / Boss</option>
                        <option value="__custom__">🖊️ Personalizado...</option>
                    </select>
                    <input type="text" id="en-icono-custom" placeholder="Pegá tu emoji acá" maxlength="4" style="display:none; margin-top: 8px;">

                    <label for="en-vida">Vida</label>
                    <input type="number" id="en-vida" min="0" required>

                    <label for="en-ca">CA</label>
                    <input type="number" id="en-ca" min="0" required>

                    <label for="en-velocidad">Velocidad (en pies)</label>
                    <input type="number" id="en-velocidad" min="0" placeholder="ej: 30" required>

                    <label for="en-iniciativa">Iniciativa</label>
                    <input type="number" id="en-iniciativa" required>

                    <label for="en-acciones-turno">Acciones por turno</label>
                    <input type="number" id="en-acciones-turno" min="1" value="1" required>

                    <label class="check-mas-dano" style="margin-top: 14px;">
                        <input type="checkbox" id="en-legendarias-check">
                        ¿Tiene acciones legendarias?
                    </label>
                    <div id="en-legendarias-cant-cont" style="display: none; margin-top: 8px;">
                        <label for="en-legendarias-cant">¿Cuántas por ronda?</label>
                        <input type="number" id="en-legendarias-cant" min="1" value="3">
                    </div>

                    <label style="margin-top: 18px;">Modificadores de habilidad</label>
                    <div class="mods-grid-form">
                        <div><label for="en-str">STR</label><input type="number" id="en-str" value="0" required></div>
                        <div><label for="en-dex">DEX</label><input type="number" id="en-dex" value="0" required></div>
                        <div><label for="en-con">CON</label><input type="number" id="en-con" value="0" required></div>
                        <div><label for="en-int">INT</label><input type="number" id="en-int" value="0" required></div>
                        <div><label for="en-wis">WIS</label><input type="number" id="en-wis" value="0" required></div>
                        <div><label for="en-cha">CHA</label><input type="number" id="en-cha" value="0" required></div>
                    </div>

                    <div class="modal-acciones">
                        <button type="button" class="btn-cancelar" data-close="modal-agregar">Cancelar</button>
                        <button type="submit" class="btn-confirmar">Confirmar</button>
                    </div>
                </form>
            </div>

            <div id="panel-confirm" class="confirm-panel" style="display: none;">
                <h3 style="color: var(--accent-color); margin-top: 0;">¿Estás seguro?</h3>
                <p id="confirm-resumen"></p>
                <div class="modal-acciones">
                    <button type="button" class="btn-cancelar" id="btn-confirm-no">No</button>
                    <button type="button" class="btn-confirmar" id="btn-confirm-si">Sí</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Modal: Importar Enemigo (JSON) ===== -->
    <div id="modal-importar" class="modal">
        <div class="modal-content form-modal modal-ancho">
            <span class="close-btn" data-close="modal-importar">&times;</span>
            <h3 style="color: var(--accent-color); margin-top: 0;">Importar Enemigo (JSON)</h3>

            <label for="import-instrucciones">1. Copiá esto y pegáselo a una IA junto con la descripción del monstruo que querés</label>
            <textarea id="import-instrucciones" readonly rows="7"></textarea>
            <button type="button" class="btn-copiar" id="btn-copiar-instrucciones">📋 Copiar instrucciones</button>

            <label for="import-json" style="margin-top: 20px;">2. Pegá acá el JSON que te devolvió la IA</label>
            <textarea id="import-json" rows="10" placeholder='{ "nombre": "...", "vidaMaxima": 30, ... }'></textarea>
            <div class="login-error" id="import-error"></div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" data-close="modal-importar">Cancelar</button>
                <button type="button" class="btn-confirmar" id="btn-importar-confirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================
        // Login de la sección Enemigos (mismo patrón que extras.html).
        // Los enemigos en sí NO viven en un array hardcodeado acá: se
        // guardan en localStorage (una key "enemigo_<id>" por cada uno,
        // creados desde el modal de abajo) y esta página los enumera
        // escaneando localStorage por prefijo "enemigo_".
        // ==========================================================
        const USUARIO_CORRECTO = 'DM';
        const CLAVE_CORRECTA = 'boss1234';

        function estaAutenticado() {
            return localStorage.getItem('enemigos_usuario') === USUARIO_CORRECTO
                && localStorage.getItem('enemigos_clave') === CLAVE_CORRECTA;
        }

        function slugify(nombre) {
            return nombre
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '') || 'enemigo';
        }

        function fmtMod(n) {
            n = parseInt(n) || 0;
            return n >= 0 ? `+${n}` : `${n}`;
        }

        function listarEnemigos() {
            const lista = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('enemigo_')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data && data.id && data.nombre) lista.push(data);
                    } catch (e) { /* key corrupta, se ignora */ }
                }
            }
            lista.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
            return lista;
        }

        function renderGrid() {
            const grid = document.getElementById('enemigos-grid');
            grid.innerHTML = '';
            const lista = listarEnemigos();

            lista.forEach(en => {
                const a = document.createElement('a');
                a.href = `enemigo.html?id=${encodeURIComponent(en.id)}`;
                a.className = 'personaje-card';
                a.innerHTML = `
                    <div class="personaje-icon">${en.icono || '👹'}</div>
                    <div class="personaje-nombre">${en.nombre}</div>
                `;
                grid.appendChild(a);
            });

            const btnAgregar = document.createElement('button');
            btnAgregar.type = 'button';
            btnAgregar.className = 'personaje-card btn-agregar';
            btnAgregar.innerHTML = `
                <div class="personaje-icon">➕</div>
                <div class="personaje-nombre">Agregar</div>
            `;
            btnAgregar.addEventListener('click', abrirModalAgregar);
            grid.appendChild(btnAgregar);

            const btnImportar = document.createElement('button');
            btnImportar.type = 'button';
            btnImportar.className = 'personaje-card btn-agregar';
            btnImportar.innerHTML = `
                <div class="personaje-icon">📥</div>
                <div class="personaje-nombre">Importar</div>
            `;
            btnImportar.addEventListener('click', abrirModalImportar);
            grid.appendChild(btnImportar);
        }

        function mostrarGrid() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('enemigos-grid').style.display = 'grid';
            document.getElementById('volver-link-grid').style.display = 'block';
            document.getElementById('subtitulo-pagina').textContent = 'Bestiario de la mesa';
            renderGrid();
        }

        function mostrarLogin() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('enemigos-grid').style.display = 'none';
            document.getElementById('volver-link-grid').style.display = 'none';
            document.getElementById('subtitulo-pagina').textContent = 'Acceso restringido';
        }

        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const usuario = document.getElementById('login-usuario').value.trim();
            const clave = document.getElementById('login-clave').value;
            const errorEl = document.getElementById('login-error');

            if (usuario === USUARIO_CORRECTO && clave === CLAVE_CORRECTA) {
                localStorage.setItem('enemigos_usuario', usuario);
                localStorage.setItem('enemigos_clave', clave);
                errorEl.textContent = '';
                mostrarGrid();
            } else {
                errorEl.textContent = 'Usuario o contraseña incorrectos.';
            }
        });

        // ===== Modal Agregar Enemigo =====
        const modalAgregar = document.getElementById('modal-agregar');
        const panelForm = document.getElementById('panel-form');
        const panelConfirm = document.getElementById('panel-confirm');
        const formEnemigo = document.getElementById('form-enemigo');
        let datosPendientes = null;

        const enIconoSelect = document.getElementById('en-icono');
        const enIconoCustom = document.getElementById('en-icono-custom');

        enIconoSelect.addEventListener('change', () => {
            const esCustom = enIconoSelect.value === '__custom__';
            enIconoCustom.style.display = esCustom ? 'block' : 'none';
            if (esCustom) enIconoCustom.focus();
        });

        function obtenerIconoElegido() {
            if (enIconoSelect.value === '__custom__') {
                return enIconoCustom.value.trim() || '👹';
            }
            return enIconoSelect.value;
        }

        const enLegendariasCheck = document.getElementById('en-legendarias-check');
        const enLegendariasCantCont = document.getElementById('en-legendarias-cant-cont');

        enLegendariasCheck.addEventListener('change', () => {
            enLegendariasCantCont.style.display = enLegendariasCheck.checked ? 'block' : 'none';
        });

        function abrirModalAgregar() {
            formEnemigo.reset();
            ['en-str', 'en-dex', 'en-con', 'en-int', 'en-wis', 'en-cha'].forEach(id => {
                document.getElementById(id).value = 0;
            });
            enIconoSelect.value = '👹';
            enIconoCustom.value = '';
            enIconoCustom.style.display = 'none';
            document.getElementById('en-acciones-turno').value = 1;
            enLegendariasCheck.checked = false;
            document.getElementById('en-legendarias-cant').value = 3;
            enLegendariasCantCont.style.display = 'none';
            panelForm.style.display = 'block';
            panelConfirm.style.display = 'none';
            modalAgregar.style.display = 'flex';
        }

        function cerrarModalAgregar() {
            modalAgregar.style.display = 'none';
            datosPendientes = null;
        }

        formEnemigo.addEventListener('submit', function (e) {
            e.preventDefault();
            const nombre = document.getElementById('en-nombre').value.trim();
            if (!nombre) return;

            datosPendientes = {
                nombre,
                icono: obtenerIconoElegido(),
                vida: parseInt(document.getElementById('en-vida').value) || 0,
                ca: parseInt(document.getElementById('en-ca').value) || 0,
                velocidad: Math.max(0, parseInt(document.getElementById('en-velocidad').value) || 0),
                iniciativa: parseInt(document.getElementById('en-iniciativa').value) || 0,
                accionesPorTurno: Math.max(1, parseInt(document.getElementById('en-acciones-turno').value) || 1),
                legendariasHabilitadas: enLegendariasCheck.checked,
                legendariasPorRonda: enLegendariasCheck.checked ? Math.max(1, parseInt(document.getElementById('en-legendarias-cant').value) || 1) : 0,
                mods: {
                    STR: parseInt(document.getElementById('en-str').value) || 0,
                    DEX: parseInt(document.getElementById('en-dex').value) || 0,
                    CON: parseInt(document.getElementById('en-con').value) || 0,
                    INT: parseInt(document.getElementById('en-int').value) || 0,
                    WIS: parseInt(document.getElementById('en-wis').value) || 0,
                    CHA: parseInt(document.getElementById('en-cha').value) || 0
                }
            };

            document.getElementById('confirm-resumen').innerHTML =
                `¿Confirmás crear a ${datosPendientes.icono} <strong>${datosPendientes.nombre}</strong>?<br>` +
                `Vida ${datosPendientes.vida} · CA ${datosPendientes.ca} · Velocidad ${datosPendientes.velocidad}ft · Iniciativa ${fmtMod(datosPendientes.iniciativa)}<br>` +
                `Acciones/turno: ${datosPendientes.accionesPorTurno}` +
                (datosPendientes.legendariasHabilitadas ? ` · Acciones legendarias: ${datosPendientes.legendariasPorRonda}/ronda` : '') + `<br>` +
                `STR ${fmtMod(datosPendientes.mods.STR)} · DEX ${fmtMod(datosPendientes.mods.DEX)} · CON ${fmtMod(datosPendientes.mods.CON)} · ` +
                `INT ${fmtMod(datosPendientes.mods.INT)} · WIS ${fmtMod(datosPendientes.mods.WIS)} · CHA ${fmtMod(datosPendientes.mods.CHA)}`;

            panelForm.style.display = 'none';
            panelConfirm.style.display = 'block';
        });

        document.getElementById('btn-confirm-no').addEventListener('click', function () {
            // "No" vuelve al modal (no lo cierra), como pidió el usuario.
            panelConfirm.style.display = 'none';
            panelForm.style.display = 'block';
        });

        document.getElementById('btn-confirm-si').addEventListener('click', function () {
            if (!datosPendientes) return;
            const id = `${slugify(datosPendientes.nombre)}_${Date.now().toString(36)}`;
            const record = {
                id,
                nombre: datosPendientes.nombre,
                icono: datosPendientes.icono,
                vidaMaxima: datosPendientes.vida,
                vidaActual: datosPendientes.vida,
                caBase: datosPendientes.ca,
                caActual: datosPendientes.ca,
                velocidad: datosPendientes.velocidad,
                iniciativa: datosPendientes.iniciativa,
                accionesPorTurno: datosPendientes.accionesPorTurno,
                legendariasHabilitadas: datosPendientes.legendariasHabilitadas,
                legendariasPorRonda: datosPendientes.legendariasPorRonda,
                turnoActual: {
                    accion: datosPendientes.accionesPorTurno,
                    bonus: 1,
                    reaccion: 1,
                    legendaria: datosPendientes.legendariasPorRonda
                },
                mods: datosPendientes.mods,
                habilidades: [],
                acciones: [],
                accionesBonus: [],
                reacciones: [],
                accionesLegendarias: []
            };
            localStorage.setItem(`enemigo_${id}`, JSON.stringify(record));
            cerrarModalAgregar();
            renderGrid();
        });

        // ==========================================================
        // Modal Importar Enemigo (JSON pegado a mano, generado por una IA).
        // No hay selector de archivo: el flujo es copiar el texto de
        // instrucciones, pegarlo en un chat de IA junto con la descripción
        // del monstruo deseado, y pegar el JSON que devuelva en el textarea
        // de abajo. Acepta tanto un objeto único como un array de objetos
        // (para importar varios enemigos de una).
        // ==========================================================
        const INSTRUCCIONES_IMPORT_JSON =
`Necesito que generes un JSON para un enemigo de D&D 5e (o varios, dentro de un array) con EXACTAMENTE esta estructura (no agregues campos extra ni el campo "id"):

{
  "nombre": string,
  "icono": string (UN solo emoji, ej "🐉"),
  "vidaMaxima": number,
  "caBase": number,
  "velocidad": number (en pies, SOLO el número, ej 30 — no "30ft"),
  "iniciativa": number (el modificador ya calculado, ej 2),
  "accionesPorTurno": number (default 1; más de 1 solo si puede repetir "Acción" en su turno, ej multiataque),
  "legendariasHabilitadas": boolean,
  "legendariasPorRonda": number (0 si legendariasHabilitadas es false),
  "mods": { "STR": number, "DEX": number, "CON": number, "INT": number, "WIS": number, "CHA": number } (los MODIFICADORES ya calculados, no el puntaje bruto),
  "habilidades": [ ...entradas... ],
  "acciones": [ ...entradas... ],
  "accionesBonus": [ ...entradas... ],
  "reacciones": [ ...entradas... ],
  "accionesLegendarias": [ ...entradas... ]
}

Cada entrada dentro de esos 5 arrays (podés dejar el array vacío [] si no aplica) tiene esta forma:

{
  "nombre": string,

        const modalImportar = document.getElementById('modal-importar');
        const importInstruccionesTA = document.getElementById('import-instrucciones');
        const importJsonTA = document.getElementById('import-json');
        const importErrorEl = document.getElementById('import-error');

        function abrirModalImportar() {
            importInstruccionesTA.value = INSTRUCCIONES_IMPORT_JSON;
            importJsonTA.value = '';
            importErrorEl.textContent = '';
            modalImportar.style.display = 'flex';
        }

        document.getElementById('btn-copiar-instrucciones').addEventListener('click', function () {
            const btn = this;
            const textoOriginal = btn.textContent;
            importInstruccionesTA.focus();
            importInstruccionesTA.select();
            let copiado = false;
            try { copiado = document.execCommand('copy'); } catch (e) { copiado = false; }
            if (!copiado && navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(INSTRUCCIONES_IMPORT_JSON).catch(() => {});
            }
            btn.textContent = '✅ Copiado';
            setTimeout(() => { btn.textContent = textoOriginal; }, 1500);
        });

        function normalizarEntradaImportada(e) {
            e = (e && typeof e === 'object') ? e : {};
            let danos = [];
            if (Array.isArray(e.danos)) {
                danos = e.danos.filter(d => d && typeof d === 'object').map(d => ({
                    cantidad: parseInt(d.cantidad) || 0,
                    dado: (['4', '6', '8', '10', '12'].includes(String(d.dado).replace(/\D/g, ''))) ? String(d.dado).replace(/\D/g, '') : '6',
                    extra: parseInt(d.extra) || 0,
                    tipoDano: d.tipoDano ? String(d.tipoDano) : ''
                }));
            }
            const bono = e.bonoAtaque;
            return {
                nombre: e.nombre ? String(e.nombre) : 'Sin nombre',
                bonoAtaque: (bono !== undefined && bono !== null && bono !== '') ? (parseInt(bono) || 0) : null,
                alcance: e.alcance ? String(e.alcance) : '',
                danos,
                consumo: (parseInt(e.consumo) > 0) ? parseInt(e.consumo) : 1,
                desc: e.desc ? String(e.desc) : '',
                efectoAdicional: e.efectoAdicional ? String(e.efectoAdicional) : ''
            };
        }

        function normalizarEnemigoImportado(obj) {
            if (!obj || typeof obj !== 'object') return null;
            const nombre = obj.nombre ? String(obj.nombre).trim() : '';
            if (!nombre) return null;

            const vidaMaxima = Math.max(1, parseInt(obj.vidaMaxima) || 1);
            const caBase = Math.max(0, parseInt(obj.caBase) || 10);
            const accionesPorTurno = Math.max(1, parseInt(obj.accionesPorTurno) || 1);
            const legendariasHabilitadas = !!obj.legendariasHabilitadas;
            const legendariasPorRonda = legendariasHabilitadas ? Math.max(1, parseInt(obj.legendariasPorRonda) || 1) : 0;
            const mods = (obj.mods && typeof obj.mods === 'object') ? obj.mods : {};
            const id = `${slugify(nombre)}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;

            return {
                id,
                nombre,
                icono: (obj.icono && String(obj.icono).trim()) || '👹',
                vidaMaxima,
                vidaActual: vidaMaxima,
                caBase,
                caActual: caBase,
                velocidad: (!isNaN(parseInt(obj.velocidad)) && parseInt(obj.velocidad) >= 0) ? parseInt(obj.velocidad) : 30,
                iniciativa: parseInt(obj.iniciativa) || 0,
                accionesPorTurno,
                legendariasHabilitadas,
                legendariasPorRonda,
                turnoActual: { accion: accionesPorTurno, bonus: 1, reaccion: 1, legendaria: legendariasPorRonda },
                mods: {
                    STR: parseInt(mods.STR) || 0,
                    DEX: parseInt(mods.DEX) || 0,
                    CON: parseInt(mods.CON) || 0,
                    INT: parseInt(mods.INT) || 0,
                    WIS: parseInt(mods.WIS) || 0,
                    CHA: parseInt(mods.CHA) || 0
                },
                habilidades: Array.isArray(obj.habilidades) ? obj.habilidades.map(normalizarEntradaImportada) : [],
                acciones: Array.isArray(obj.acciones) ? obj.acciones.map(normalizarEntradaImportada) : [],
                accionesBonus: Array.isArray(obj.accionesBonus) ? obj.accionesBonus.map(normalizarEntradaImportada) : [],
                reacciones: Array.isArray(obj.reacciones) ? obj.reacciones.map(normalizarEntradaImportada) : [],
                accionesLegendarias: Array.isArray(obj.accionesLegendarias) ? obj.accionesLegendarias.map(normalizarEntradaImportada) : []
            };
        }

        document.getElementById('btn-importar-confirmar').addEventListener('click', function () {
            const raw = importJsonTA.value.trim();
            importErrorEl.textContent = '';

            if (!raw) {
                importErrorEl.textContent = 'Pegá un JSON primero.';
                return;
            }

            let parsed;
            try {
                parsed = JSON.parse(raw);
            } catch (e) {
                importErrorEl.textContent = 'Ese texto no es un JSON válido: ' + e.message;
                return;
            }

            const lista = Array.isArray(parsed) ? parsed : [parsed];
            const importados = lista.map(normalizarEnemigoImportado).filter(Boolean);

            if (importados.length === 0) {
                importErrorEl.textContent = 'No se pudo importar: a cada enemigo le falta el campo "nombre".';
                return;
            }

            importados.forEach(en => localStorage.setItem(`enemigo_${en.id}`, JSON.stringify(en)));
            modalImportar.style.display = 'none';
            renderGrid();
        });

        // Cierre por X / botón data-close.
        document.querySelectorAll('[data-close]').forEach(el => {
            el.addEventListener('click', () => {
                document.getElementById(el.dataset.close).style.display = 'none';
                datosPendientes = null;
            });
        });

        // A propósito NO hay cierre clickeando afuera del modal: solo la X / "Cancelar"
        // lo cierran, para que un misclick no lo cierre por accidente.

        // Al cargar la página: si ya había sesión guardada, saltear el login directo.
        if (estaAutenticado()) {
            mostrarGrid();
        } else {
            mostrarLogin();
        }
    </script>
