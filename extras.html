<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extras - Selección de Personaje - DnD 5e</title>
    <link rel="stylesheet" href="estilos-menu.css">
    <script>
        // Aplica el tema guardado ANTES de pintar la página (evita el flash del tema por defecto).
        (function () {
            try {
                if (localStorage.getItem('tema') === 'oscuro') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <button type="button" id="btn-tema" class="btn-tema" title="Cambiar tema">🌙</button>
    <script>
        // Toggle de tema claro/oscuro (mismo patrón en todas las páginas de la app).
        (function () {
            var btn = document.getElementById('btn-tema');
            function actualizarIconoTema() {
                var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = oscuro ? '☀️' : '🌙';
                btn.title = oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
            }
            actualizarIconoTema();
            btn.addEventListener('click', function () {
                var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
                if (oscuro) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('tema', 'claro');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('tema', 'oscuro');
                }
                actualizarIconoTema();
            });
        })();
    </script>
    <div class="menu-container">
        <header>
            <h1 id="titulo-pagina">Extras</h1>
            <p class="subtitle" id="subtitulo-pagina">Acceso restringido</p>
        </header>

        <!-- === Formulario de login (se oculta si ya hay sesión guardada) === -->
        <div class="login-container" id="login-container">
            <form class="login-form" id="login-form" autocomplete="off">
                <div>
                    <label for="login-usuario">Usuario</label>
                    <input type="text" id="login-usuario" name="usuario" autocomplete="off" required>
                </div>
                <div>
                    <label for="login-clave">Contraseña</label>
                    <input type="password" id="login-clave" name="clave" autocomplete="off" required>
                </div>
                <div class="login-error" id="login-error"></div>
                <button type="submit">Ingresar</button>
            </form>
            <a href="index.html" class="volver-link">← Volver al menú principal</a>
        </div>

        <!-- === Grid de personajes extra (se muestra solo si el login es correcto) === -->
        <div class="personajes-grid" id="personajes-grid" style="display: none;"></div>
        <div id="sesion-bar" style="display: none; text-align: center; margin-top: 20px;">
            <a href="index.html" class="volver-link" style="display: inline; margin: 0 12px;">← Volver al menú principal</a>
            <button type="button" id="btn-cerrar-sesion" class="volver-link" style="display: inline; margin: 0 12px; background: none; border: none; font: inherit; cursor: pointer; padding: 0;">🔓 Cerrar sesión</button>
        </div>
    </div>

    <script>
        // ==========================================================
        // Lista de personajes "extra" que viven detrás de este login.
        // Para agregar uno nuevo: sumarlo acá con su ícono/nombre, Y
        // agregar su id a PERSONAJES_EXTRA en el guard de personaje.html.
        // ==========================================================
        const PERSONAJES_EXTRA = [
            { id: 'varis', nombre: 'Varis', icono: '🏹' },
            { id: 'kael', nombre: 'Kael', icono: '🙏' }
        ];

        const USUARIO_CORRECTO = 'DM';
        const CLAVE_CORRECTA = 'boss1234';

        function estaAutenticado() {
            return localStorage.getItem('extras_usuario') === USUARIO_CORRECTO
                && localStorage.getItem('extras_clave') === CLAVE_CORRECTA;
        }

        function renderGrid() {
            const grid = document.getElementById('personajes-grid');
            grid.innerHTML = '';
            PERSONAJES_EXTRA.forEach(p => {
                const a = document.createElement('a');
                a.href = `personaje.html?p=${p.id}`;
                a.className = 'personaje-card';
                a.innerHTML = `
                    <div class="personaje-icon">${p.icono}</div>
                    <div class="personaje-nombre">${p.nombre}</div>
                `;
                grid.appendChild(a);
            });

            const combate = document.createElement('a');
            combate.href = 'combate.html';
            combate.className = 'personaje-card personaje-card-extras';
            combate.innerHTML = `
                <div class="personaje-icon">⚔️</div>
                <div class="personaje-nombre">Combate</div>
            `;
            grid.appendChild(combate);

            const enemigos = document.createElement('a');
            enemigos.href = 'enemigos.html';
            enemigos.className = 'personaje-card personaje-card-extras';
            enemigos.innerHTML = `
                <div class="personaje-icon">🐉</div>
                <div class="personaje-nombre">Enemigos</div>
            `;
            grid.appendChild(enemigos);
        }

        function mostrarGrid() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('personajes-grid').style.display = 'grid';
            document.getElementById('sesion-bar').style.display = 'block';
            document.getElementById('subtitulo-pagina').textContent = 'Hoja de Personaje - DnD 5e';
            renderGrid();
        }

        function mostrarLogin() {
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('personajes-grid').style.display = 'none';
            document.getElementById('sesion-bar').style.display = 'none';
            document.getElementById('subtitulo-pagina').textContent = 'Acceso restringido';
        }

        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const usuario = document.getElementById('login-usuario').value.trim();
            const clave = document.getElementById('login-clave').value;
            const errorEl = document.getElementById('login-error');

            if (usuario === USUARIO_CORRECTO && clave === CLAVE_CORRECTA) {
                localStorage.setItem('extras_usuario', usuario);
                localStorage.setItem('extras_clave', clave);
                errorEl.textContent = '';
                mostrarGrid();
            } else {
                errorEl.textContent = 'Usuario o contraseña incorrectos.';
            }
        });

        // "Cerrar sesión": borra la sesión guardada y vuelve al login, para poder tipear
        // usuario/clave de nuevo si en algún momento cambian (ya no hay forma de "editarlos"
        // una vez logueado más que volver a pasar por acá).
        document.getElementById('btn-cerrar-sesion').addEventListener('click', function () {
            localStorage.removeItem('extras_usuario');
            localStorage.removeItem('extras_clave');
            document.getElementById('login-usuario').value = '';
            document.getElementById('login-clave').value = '';
            mostrarLogin();
        });

        // Al cargar la página: si ya había sesión guardada, saltear el login directo.
        if (estaAutenticado()) {
            mostrarGrid();
        } else {
            mostrarLogin();
        }
    </script>
</body>
</html>
